# Déploiement Render (https://render.com) — plan gratuit possible.
# Render fournit la variable PORT ; server.py écoute alors sur 0.0.0.0.
services:
  - type: web
    name: feux-france
    runtime: python
    plan: free
    buildCommand: "echo 'aucune dépendance (stdlib uniquement)'"
    startCommand: "python3 server.py"
